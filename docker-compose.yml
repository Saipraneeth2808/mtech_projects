services:

  cervical-spine-app:

    build:
      context: .

    container_name: cervical-spine-mri-app

    ports:
      - "5000:5000"

    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./mlops:/app/mlops
      - ./website/uploads:/app/website/uploads

    restart: unless-stopped


  mlflow:

    image: python:3.11-slim

    container_name: cervical-spine-mlflow

    working_dir: /mlflow

    volumes:
      - ./mlops/mlruns:/mlflow/mlruns

    ports:
      - "5001:5000"

    command: >
      sh -c "
      pip install mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri
      /mlflow/mlruns
      "

    restart: unless-stopped