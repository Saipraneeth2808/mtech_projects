name: Cervical Spine MRI - CD

on:
  workflow_run:
    workflows:
      - "Cervical Spine MRI - CI"
    types:
      - completed

  workflow_dispatch:

jobs:

  deploy:
    name: Build, Package and Deploy Application
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ==========================================================
      # 1. CHECKOUT EXACT CI COMMIT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. DISPLAY ENVIRONMENT
      # ==========================================================
      - name: Display build environment
        run: |
          echo "=========================================="
          echo "CERVICAL SPINE MRI - CD PIPELINE"
          echo "=========================================="

          python --version
          pip --version

          echo "Operating System:"
          uname -a

          echo "Git commit:"
          git rev-parse HEAD

          echo "Git branch:"
          git branch --show-current

      # ==========================================================
      # 4. UPGRADE PIP
      # ==========================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # ==========================================================
      # 5. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "Installing project dependencies..."
            pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt not found."
            echo "Continuing with validation."
          fi

      # ==========================================================
      # 6. VERIFY PROJECT STRUCTURE
      # ==========================================================
      - name: Verify project structure
        run: |

          echo "=========================================="
          echo "VERIFYING PROJECT STRUCTURE"
          echo "=========================================="

          REQUIRED_DIRS="
          detection
          models
          preprocessing
          utils
          website
          mlops
          "

          for directory in $REQUIRED_DIRS
          do
            if [ -d "$directory" ]; then
              echo "PASS: $directory/"
            else
              echo "FAIL: $directory/ not found"
              exit 1
            fi
          done

          if [ -f run_pipeline.py ]; then
            echo "PASS: run_pipeline.py"
          else
            echo "FAIL: run_pipeline.py not found"
            exit 1
          fi

          if [ -f requirements.txt ]; then
            echo "PASS: requirements.txt"
          else
            echo "WARNING: requirements.txt not found"
          fi

      # ==========================================================
      # 7. PYTHON SYNTAX VALIDATION
      # ==========================================================
      - name: Validate Python source code
        run: |

          echo "=========================================="
          echo "PYTHON SYNTAX VALIDATION"
          echo "=========================================="

          python -m compileall \
            detection \
            models \
            preprocessing \
            utils \
            website \
            mlops

          python -m py_compile run_pipeline.py

          echo "Python syntax validation PASSED"

      # ==========================================================
      # 8. VALIDATE APPLICATION FILES
      # ==========================================================
      - name: Validate application files
        run: |

          echo "=========================================="
          echo "APPLICATION VALIDATION"
          echo "=========================================="

          if [ -f website/app.py ]; then
            echo "PASS: website/app.py"
            python -m py_compile website/app.py
          else
            echo "WARNING: website/app.py not found"
          fi

          if [ -f detection/detector.py ]; then
            echo "PASS: detection/detector.py"
          else
            echo "FAIL: detection/detector.py not found"
            exit 1
          fi

          if [ -f models/architectures.py ]; then
            echo "PASS: models/architectures.py"
          else
            echo "FAIL: models/architectures.py not found"
            exit 1
          fi

      # ==========================================================
      # 9. CREATE DEPLOYMENT DIRECTORY
      # ==========================================================
      - name: Create deployment package
        run: |

          echo "=========================================="
          echo "CREATING DEPLOYMENT PACKAGE"
          echo "=========================================="

          rm -rf deployment

          mkdir -p deployment

          cp -r detection deployment/
          cp -r models deployment/
          cp -r preprocessing deployment/
          cp -r utils deployment/
          cp -r website deployment/
          cp -r mlops deployment/

          cp run_pipeline.py deployment/

          if [ -f requirements.txt ]; then
            cp requirements.txt deployment/
          fi

          echo ""
          echo "Deployment package contents:"
          find deployment -maxdepth 3 -type f | sort

      # ==========================================================
      # 10. CREATE BUILD INFORMATION
      # ==========================================================
      - name: Generate build information
        run: |

          echo "Generating BUILD_INFO.txt"

          cat > deployment/BUILD_INFO.txt <<EOF
          ==========================================
          Cervical Spine MRI MLOps Application
          ==========================================

          Build Type: Continuous Deployment

          Python Version:
          $(python --version)

          Build Date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Git Commit:
          $(git rev-parse HEAD)

          Git Branch:
          $(git branch --show-current)

          CI Status:
          PASSED

          CD Build:
          PASSED

          Package Creation:
          PASSED

          Artifact Generation:
          PASSED

          ==========================================
          EOF

          cat deployment/BUILD_INFO.txt

      # ==========================================================
      # 11. CREATE ZIP
      # ==========================================================
      - name: Create deployment ZIP
        run: |

          echo "=========================================="
          echo "CREATING DEPLOYMENT ZIP"
          echo "=========================================="

          cd deployment

          zip -r ../cervical-spine-mri-application.zip .

          cd ..

          ls -lh cervical-spine-mri-application.zip

      # ==========================================================
      # 12. VERIFY ZIP
      # ==========================================================
      - name: Verify deployment artifact
        run: |

          echo "=========================================="
          echo "VERIFYING DEPLOYMENT ARTIFACT"
          echo "=========================================="

          if [ ! -f cervical-spine-mri-application.zip ]; then
            echo "ERROR: Deployment ZIP was not created"
            exit 1
          fi

          echo "Deployment artifact exists"

          echo ""
          echo "Artifact size:"
          du -h cervical-spine-mri-application.zip

          echo ""
          echo "Artifact contents:"
          unzip -l cervical-spine-mri-application.zip

      # ==========================================================
      # 13. UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervical-spine-mri-application
          path: cervical-spine-mri-application.zip
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 14. DEPLOYMENT STAGE
      # ==========================================================
      - name: Deployment stage
        run: |

          echo ""
          echo "=========================================="
          echo "CERVICAL SPINE MRI - CD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "CI validation         : PASSED"
          echo "Python environment    : READY"
          echo "Dependencies          : INSTALLED"
          echo "Source validation     : PASSED"
          echo "Application validation: PASSED"
          echo "Build                 : PASSED"
          echo "Packaging             : PASSED"
          echo "Artifact verification: PASSED"
          echo "Artifact upload       : PASSED"
          echo "Deployment stage     : COMPLETED"

          echo ""
          echo "Deployment artifact:"
          echo "cervical-spine-mri-application.zip"

          echo ""
          echo "=========================================="

      # ==========================================================
      # 15. FINAL SUMMARY
      # ==========================================================
      - name: CD Pipeline Summary
        run: |

          echo ""
          echo "############################################"
          echo "#     CERVICAL SPINE MRI MLOPS CD         #"
          echo "############################################"
          echo "#"
          echo "# CI -> CD Trigger       : SUCCESS"
          echo "# Checkout               : SUCCESS"
          echo "# Python Setup           : SUCCESS"
          echo "# Dependencies           : SUCCESS"
          echo "# Structure Validation   : SUCCESS"
          echo "# Source Validation      : SUCCESS"
          echo "# Application Validation : SUCCESS"
          echo "# Build                  : SUCCESS"
          echo "# Packaging              : SUCCESS"
          echo "# Artifact               : SUCCESS"
          echo "# Deployment Stage       : SUCCESS"
          echo "#"
          echo "############################################"