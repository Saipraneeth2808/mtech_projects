name: Cervical Spine MRI - CD

on:
  workflow_run:
    workflows:
      - "Cervical Spine MRI - CI"
    types:
      - completed

jobs:

  deploy:
    name: Build and Deploy Application
    runs-on: ubuntu-latest

    # Only deploy when CI completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Setup Python
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------
      # 3. Upgrade pip
      # ----------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # ----------------------------------------
      # 4. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            echo "Continuing without dependency installation"
          fi

      # ----------------------------------------
      # 5. Validate application
      # ----------------------------------------
      - name: Validate application
        run: |
          python -m compileall detection models preprocessing utils website

      # ----------------------------------------
      # 6. Create deployment package
      # ----------------------------------------
      - name: Create deployment package
        run: |
          mkdir -p deployment

          cp -r detection deployment/
          cp -r models deployment/
          cp -r preprocessing deployment/
          cp -r utils deployment/
          cp -r website deployment/
          cp -r mlops deployment/

          cp run_pipeline.py deployment/

          if [ -f requirements.txt ]; then
            cp requirements.txt deployment/
          fi

      # ----------------------------------------
      # 7. Create ZIP
      # ----------------------------------------
      - name: Create deployment ZIP
        run: |
          cd deployment
          zip -r ../cervical-spine-mri-application.zip .

      # ----------------------------------------
      # 8. Upload deployment artifact
      # ----------------------------------------
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervical-spine-mri-application
          path: cervical-spine-mri-application.zip

      # ----------------------------------------
      # 9. Deployment stage
      # ----------------------------------------
      - name: Deployment
        run: |
          echo "=========================================="
          echo "CERVICAL SPINE MRI CD SUCCESSFUL"
          echo "=========================================="
          echo "CI validation        : PASSED"
          echo "Application build    : PASSED"
          echo "Deployment package   : CREATED"
          echo "Artifact upload      : PASSED"
          echo "Deployment stage     : COMPLETED"