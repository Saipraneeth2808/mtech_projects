name: Cervical Spine MRI - CD

on:
  workflow_run:
    workflows:
      - "Cervical Spine MRI - CI"
    types:
      - completed

jobs:

  deploy:
    name: Build, Package and Deploy Application
    runs-on: ubuntu-latest

    # Run CD only when CI has completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. DISPLAY ENVIRONMENT
      # ==========================================================
      - name: Display build environment
        run: |
          echo "=========================================="
          echo "CERVICAL SPINE MRI - CD PIPELINE"
          echo "=========================================="
          python --version
          pip --version
          echo "Operating System:"
          uname -a

      # ==========================================================
      # 4. UPGRADE PIP
      # ==========================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # ==========================================================
      # 5. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "Installing project dependencies..."
            pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt not found."
            echo "Continuing with validation."
          fi

      # ==========================================================
      # 6. VERIFY PROJECT STRUCTURE
      # ==========================================================
      - name: Verify project structure
        run: |
          echo "Checking Cervical Spine MRI project structure..."

          for directory in detection models preprocessing utils website mlops; do
            if [ -d "$directory" ]; then
              echo "OK: $directory/"
            else
              echo "WARNING: $directory/ not found"
            fi
          done

          if [ -f run_pipeline.py ]; then
            echo "OK: run_pipeline.py"
          else
            echo "WARNING: run_pipeline.py not found"
          fi

          if [ -f requirements.txt ]; then
            echo "OK: requirements.txt"
          else
            echo "WARNING: requirements.txt not found"
          fi

      # ==========================================================
      # 7. PYTHON SYNTAX VALIDATION
      # ==========================================================
      - name: Validate Python source code
        run: |
          echo "Running Python syntax validation..."

          python -m compileall \
            detection \
            models \
            preprocessing \
            utils \
            website \
            mlops

          echo "Python syntax validation completed successfully."

      # ==========================================================
      # 8. VALIDATE MAIN PIPELINE
      # ==========================================================
      - name: Validate main pipeline
        run: |
          if [ -f run_pipeline.py ]; then
            python -m py_compile run_pipeline.py
            echo "run_pipeline.py validation PASSED"
          else
            echo "run_pipeline.py not available"
          fi

      # ==========================================================
      # 9. CREATE DEPLOYMENT DIRECTORY
      # ==========================================================
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."

          rm -rf deployment
          mkdir -p deployment

          # Copy project modules
          for directory in detection models preprocessing utils website mlops; do
            if [ -d "$directory" ]; then
              cp -r "$directory" deployment/
              echo "Added $directory/"
            fi
          done

          # Copy main pipeline
          if [ -f run_pipeline.py ]; then
            cp run_pipeline.py deployment/
            echo "Added run_pipeline.py"
          fi

          # Copy requirements
          if [ -f requirements.txt ]; then
            cp requirements.txt deployment/
            echo "Added requirements.txt"
          fi

          echo ""
          echo "Deployment package contents:"
          find deployment -maxdepth 2 -type f | sort

      # ==========================================================
      # 10. CREATE BUILD INFORMATION
      # ==========================================================
      - name: Generate build information
        run: |
          echo "Generating build information..."

          cat > deployment/BUILD_INFO.txt <<EOF
          ==========================================
          Cervical Spine MRI MLOps Application
          ==========================================

          Build Type: Continuous Deployment
          Python Version: $(python --version)
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Git Commit: $GITHUB_SHA
          Git Branch: $GITHUB_REF_NAME

          CI Status: PASSED
          CD Build: PASSED
          Package Creation: PASSED
          Artifact Generation: PASSED
          ==========================================
          EOF

          cat deployment/BUILD_INFO.txt

      # ==========================================================
      # 11. CREATE ZIP ARTIFACT
      # ==========================================================
      - name: Create deployment ZIP
        run: |
          echo "Creating deployment ZIP..."

          cd deployment

          zip -r ../cervical-spine-mri-application.zip .

          cd ..

          echo ""
          echo "Deployment ZIP created:"
          ls -lh cervical-spine-mri-application.zip

      # ==========================================================
      # 12. VERIFY ZIP
      # ==========================================================
      - name: Verify deployment artifact
        run: |
          echo "Verifying deployment artifact..."

          if [ -f cervical-spine-mri-application.zip ]; then
            echo "Deployment artifact exists."

            echo ""
            echo "Artifact size:"
            du -h cervical-spine-mri-application.zip

            echo ""
            echo "Artifact contents:"
            unzip -l cervical-spine-mri-application.zip

          else
            echo "ERROR: Deployment artifact was not created."
            exit 1
          fi

      # ==========================================================
      # 13. UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervical-spine-mri-application
          path: cervical-spine-mri-application.zip
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 14. DEPLOYMENT STAGE
      # ==========================================================
      - name: Deployment stage
        run: |
          echo ""
          echo "=========================================="
          echo "CERVICAL SPINE MRI - CD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "CI validation        : PASSED"
          echo "Python environment   : READY"
          echo "Dependencies         : INSTALLED"
          echo "Source validation    : PASSED"
          echo "Application build    : PASSED"
          echo "Deployment package   : CREATED"
          echo "Artifact verification: PASSED"
          echo "Artifact upload      : PASSED"
          echo ""
          echo "Deployment artifact:"
          echo "cervical-spine-mri-application.zip"
          echo ""
          echo "Deployment stage     : COMPLETED"
          echo "=========================================="

      # ==========================================================
      # 15. FINAL STATUS
      # ==========================================================
      - name: CD Pipeline Summary
        run: |
          echo ""
          echo "##########################################"
          echo "#     CERVICAL SPINE MRI MLOPS CD       #"
          echo "##########################################"
          echo "#"
          echo "# CI → CD trigger       : SUCCESS"
          echo "# Build                 : SUCCESS"
          echo "# Validation            : SUCCESS"
          echo "# Packaging             : SUCCESS"
          echo "# Artifact              : SUCCESS"
          echo "# Deployment stage     : SUCCESS"
          echo "#"
          echo "##########################################"